<a class="skip-link" href="#main">Skip to content</a>

<header class="app-header">
  @if (studentPage()) {
    <span class="brand">QuizForge</span>
  } @else {
    <a routerLink="/" class="brand">QuizForge</a>
    <nav aria-label="Main">
      <a
        routerLink="/"
        [class.active]="lessonsActive()"
        [attr.aria-current]="lessonsActive() ? 'true' : null"
        >Lessons</a
      >
      <a routerLink="/usage" routerLinkActive="active" ariaCurrentWhenActive="page">Usage</a>
      <a routerLink="/evals" routerLinkActive="active" ariaCurrentWhenActive="page">Evals</a>
    </nav>
  }
</header>

@if (info()?.demoMode && !studentPage()) {
  <div class="demo-banner" role="note" aria-label="Demo mode">
    <strong>Demo mode:</strong> no API key is set, so quizzes can only be generated from the sample
    lessons ({{ sampleTitles() }}). Open one under <a routerLink="/">Lessons</a> and use Generate
    another quiz.
  </div>
}

<main id="main" class="app-main" tabindex="-1">
  <router-outlet />
</main>
