# The web container: serves the built Angular app and proxies /api to the API
# container, so the browser talks to one origin (no CORS).
server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The API trusts one proxy hop (TRUST_PROXY_HOPS=1) and rate limits by this address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-Sent Events (the quiz stream): pass each event on at once, and
    # keep the connection open for the whole generation.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # Angular routes (/lessons/..., /q/...) are the app's, not files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must not be cached, so a new build is picked up; the hashed bundles can be.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
