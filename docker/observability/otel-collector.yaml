# Receives OTLP over HTTP from the API (port 4318) and forwards traces to Tempo.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # "otlp_grpc" ("otlp" is a deprecated alias since collector 0.16x).
  otlp_grpc:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc]
