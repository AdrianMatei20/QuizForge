# Local development infrastructure only. Credentials here are throwaway dev defaults;
# override them through your shell or a root .env file if you need to.
name: quizforge

services:
  postgres:
    image: postgres:18-alpine
    container_name: quizforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizforge}
      POSTGRES_DB: ${POSTGRES_DB:-quizforge}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: quizforge-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- The whole app: only with `docker compose --profile full up -d --build` ---
  # A working demo with no API key: the fake LLM provider answers the sample
  # lessons, and the API seeds them (plus a published quiz) on start. For real
  # quizzes, set LLM_PROVIDER=anthropic, LLM_API_KEY and LLM_MODEL in your shell:
  # the key reaches the container as an environment variable at run time only.

  api:
    build: ./api
    image: quizforge-api
    container_name: quizforge-api
    profiles: [full]
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Its own database, created on first start, so demo data never mixes with local development.
      DATABASE_URL: postgres://${POSTGRES_USER:-quizforge}:${POSTGRES_PASSWORD:-quizforge}@postgres:5432/quizforge_demo
      # Redis database 2: not shared with the local dev API (0) or the tests (1).
      REDIS_URL: redis://redis:6379/2
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-fake-model}
      LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL:-fake-judge-model}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-1.00}
      LLM_CACHE_TTL_SECONDS: "86400"
      # The web container's nginx is the one proxy in front of the API.
      TRUST_PROXY_HOPS: "1"
      SEED_ON_START: "true"
    ports:
      # Swagger UI at http://localhost:3001/docs; the app itself is on 8080.
      - "127.0.0.1:${API_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    image: quizforge-web
    container_name: quizforge-web
    profiles: [full]
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  # --- Observability: only with `docker compose --profile observability up -d` ---
  # The API runs on the host, so Prometheus scrapes host.docker.internal:3000
  # and the API sends traces to the collector on localhost:4318.

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: quizforge-prometheus
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # host.docker.internal also on Linux (Docker Desktop provides it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    container_name: quizforge-otel-collector
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:3.1.0
    container_name: quizforge-tempo
    profiles: [observability]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.3
    container_name: quizforge-grafana
    profiles: [observability]
    environment:
      # Local only (bound to 127.0.0.1): open without a login, able to explore.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/quizforge-llm.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3030}:3000"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  tempo-data:
  grafana-data:
