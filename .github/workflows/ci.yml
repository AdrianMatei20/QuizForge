# Lint, tests and production builds for the API and the web app, a check that
# the committed API spec and web types are up to date, then the whole app in
# Docker (fake LLM provider) with one browser test and the Postman happy path.
# Needs no secrets: every LLM call in CI goes to the fake provider.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.2

jobs:
  api:
    name: API (lint, unit, e2e, build, spec drift)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      # Matches api/.env.test: user quizforge, database quizforge_test.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: quizforge
          POSTGRES_PASSWORD: quizforge
          POSTGRES_DB: quizforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quizforge -d quizforge_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Resets the test database and runs every migration from an empty schema first.
      - run: npm run test:e2e
      - run: npm run build
      - name: The committed OpenAPI spec and generated Postman collection are up to date
        run: |
          npm run openapi:export
          git diff --exit-code -- ../postman/openapi.json ../postman/QuizForge.generated.postman_collection.json

  web:
    name: Web (lint, unit, build, API types drift)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
      - name: The committed API types match postman/openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/app/core/api/openapi.generated.ts

  full-stack:
    name: Full stack in Docker (browser test, Postman happy path)
    needs: [api, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            api/package-lock.json
      - name: Start the full stack (fake LLM provider, seeded demo data)
        run: docker compose --profile full up -d --build --wait
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium
      - name: Browser test of the whole flow
        working-directory: e2e
        run: npm test
        env:
          CI: "true"
      - name: Postman happy path (Newman) against the API container
        working-directory: api
        run: |
          npm ci
          npm run postman:happy-path -- --env-var baseUrl=http://localhost:3001
      - name: Container logs
        if: failure()
        run: docker compose --profile full logs --no-color > docker-logs.txt
      - name: Upload the Playwright report and container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-failure
          path: |
            e2e/playwright-report
            e2e/test-results
            docker-logs.txt
          retention-days: 7
